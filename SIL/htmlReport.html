<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8' />
    <title>Reporte</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom right, #fef4f8, #fceded);
            color: #333;
        }

        h1 {
            color: #8a2be2; /* Morado/Violeta */
            text-align: center;
            font-size: 24px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        th, td {
            border: 1px solid #e0b0d1; /* Borde rosa oscuro */
            padding: 10px;
            text-align: left;
        }

        thead {
            /* El morado de tu cabecera de imagen */
            background-color: #6a006a;
            color: #ffffff;
        }

        th {
            font-size: 14px;
        }

        tr:nth-child(even) {
            background-color: #fdf6fa; /* Rosa muy pálido para filas pares */
        }

        tr:hover {
            background-color: #fce4f4; /* Rosa pálido al pasar el mouse */
        }

        td {
            font-size: 12px;
        }

        .numero {
            text-align: right; /* Alinea números a la derecha */
        }
    </style>
</head>
<body>
    <h1></h1>

    <table>
        <thead>
            <tr>
                <th>Producto</th>
                <th>Total Vendido</th>
                <th>Subtotal Vendido</th>
                <th>% Respecto Total</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
</body>
</html>
